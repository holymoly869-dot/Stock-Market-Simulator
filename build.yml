name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Cordova app
        run: |
          npm install -g cordova@12.0.0
          cordova create app com.molyholy.stockmarketsim "Stock Market Simulator"
          sed -i 's|</widget>|<preference name="Orientation" value="portrait" /><preference name="KeepRunning" value="true" /></widget>|' app/config.xml

      - name: Add the game page
        run: |
          {
            printf '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>[hidden]{display:none!important}html,body{margin:0}</style>'
            printf '<script src="cordova.js"></script>'
            cat index.html
            printf '</html>'
          } > app/www/index.html

      - name: Add the LAN plugin
        run: |
          mkdir -p plugin/src/android
          cp plugin.xml plugin/plugin.xml
          cp LanPlugin.java plugin/src/android/LanPlugin.java
          # Cordova refuses a local plugin folder without a package.json; id must match plugin.xml
          cat > plugin/package.json <<'JSON'
          {
            "name": "cordova-plugin-sms-lan",
            "version": "1.0.0",
            "description": "LAN sockets and game discovery for Stock Market Simulator",
            "cordova": { "id": "cordova-plugin-sms-lan", "platforms": ["android"] },
            "keywords": ["ecosystem:cordova", "cordova-android"],
            "license": "MIT"
          }
          JSON

      - name: Build
        run: |
          cd app
          cordova platform add android@13.0.0
          cordova plugin add ../plugin
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: stock-market-simulator-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/platforms/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK. Install on every phone that will play."

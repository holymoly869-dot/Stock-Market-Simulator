name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Cordova app
        run: |
          npm install -g cordova@12.0.0
          cordova create app com.molyholy.stockmarketsim "Stock Market Simulator"
          sed -i 's|</widget>|<preference name="Orientation" value="portrait" /><preference name="KeepRunning" value="true" /><preference name="loadUrlTimeoutValue" value="60000" /></widget>|' app/config.xml

      - name: Add the game page
        run: |
          {
            printf '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>[hidden]{display:none!important}html,body{margin:0}</style>'
            printf '<script src="cordova.js"></script>'
            # fonts load from the script after the page is up, so they never block start-up
            cat index.html
            printf '</html>'
          } > app/www/index.html

      - name: Add Android platform
        run: |
          cd app
          cordova platform add android@13.0.0
          echo "Permissions in the manifest (INTERNET is needed for online play):"
          grep -n 'uses-permission' platforms/android/app/src/main/AndroidManifest.xml || true

      # Optional: put a square icon.png (512x512 or bigger) next to index.html and it becomes the app icon.
      # continue-on-error: if this step ever fails, the APK still builds with the default icon.
      - name: App icon
        continue-on-error: true
        run: |
          if [ ! -f icon.png ]; then echo "No icon.png in the repo, keeping the default icon."; exit 0; fi
          command -v convert >/dev/null || command -v magick >/dev/null || sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          RES=${RES:-app/platforms/android/app/src/main/res}
          OUT=$(mktemp -d)
          # background colour = the icon's corner pixel (white if that corner is transparent)
          HEX=$("$IM" icon.png -format '%[hex:p{2,2}]' info:)
          BG=${HEX:0:6}; if [ ${#HEX} -ge 8 ] && [ "${HEX:6:2}" = "00" ]; then BG=FFFFFF; fi
          mkdir -p "$OUT/values" "$OUT/mipmap-anydpi-v26"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="sms_icon_bg">#%s</color></resources>\n' "$BG" > "$OUT/values/sms_icon_bg.xml"
          for X in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/sms_icon_bg"/>\n  <foreground android:drawable="@mipmap/sms_icon_fg"/>\n</adaptive-icon>\n' > "$OUT/mipmap-anydpi-v26/$X.xml"
          done
          for D in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read -r N L F <<< "$D"
            mkdir -p "$OUT/mipmap-$N"
            "$IM" icon.png -resize ${L}x${L}^ -gravity center -extent ${L}x${L} "$OUT/mipmap-$N/ic_launcher.png"
            cp "$OUT/mipmap-$N/ic_launcher.png" "$OUT/mipmap-$N/ic_launcher_round.png"
            INNER=$((F * 66 / 100))
            "$IM" icon.png -resize ${INNER}x${INNER}^ -gravity center -extent ${INNER}x${INNER} -background none -extent ${F}x${F} "$OUT/mipmap-$N/sms_icon_fg.png"
          done
          # everything is generated, only now touch the project: drop the template's launcher files, then copy ours in
          find "$RES" -path '*mipmap*' -name 'ic_launcher*' -delete
          cp -r "$OUT"/. "$RES"/
          echo "Icon installed. Launcher files now:"; find "$RES" -name 'ic_launcher*' -o -name 'sms_icon*' | sort
          grep -n 'icon' app/platforms/android/app/src/main/AndroidManifest.xml || true

      - name: Build
        run: |
          cd app
          # The first step of the build downloads/tests the Gradle 8.7 distribution. When services.gradle.org
          # hiccups it fails in seconds, so retry, and from the 2nd try fetch straight from downloads.gradle.org.
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then
              echo "Retrying build (attempt $i)..."; sleep 20
              export CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://downloads.gradle.org/distributions/gradle-8.7-bin.zip
            fi
            cordova build android --debug && exit 0
            echo "Build attempt $i failed"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: stock-market-simulator-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/platforms/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK. Install on every phone that will play."
